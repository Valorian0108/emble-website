services:
  - type: web
    name: emble-creative-academy
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/emble-website run build
    staticPublishPath: artifacts/emble-website/dist/public
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
