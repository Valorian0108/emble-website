kind = "web"
previewPath = "/"
title = "Emble Creative Academy"
version = "1.0.0"
id = "artifacts/emble-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23591

[services.development]
run = "pnpm --filter @workspace/emble-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/emble-website", "run", "build" ]
publicDir = "artifacts/emble-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23591"
BASE_PATH = "/"
